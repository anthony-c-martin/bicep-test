name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  USE_NIGHTLY: false

jobs:
  node:
    name: Node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/node

    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v7
      with:
        node-version: 24

    - name: npm ci
      run: npm ci --legacy-peer-deps

    - name: npm test
      run: npm test

    - name: Check public API
      run: npm run api:check

  dotnet:
    name: C#
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Test and check public API
      run: dotnet test packages/dotnet/BicepTest.slnx --configuration Release

  go:
    name: Go
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: packages/go/go.mod

    - name: Test
      working-directory: packages/go
      run: go test ./...

    - name: Check public API
      working-directory: packages/go
      run: go run ./internal/apidoc --check

  powershell:
    name: PowerShell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
    - uses: actions/checkout@v7

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - name: Install Pester
      shell: pwsh
      run: Install-Module Pester -MinimumVersion 5.7.1 -Scope CurrentUser -Force

    - name: Build
      shell: pwsh
      run: ./packages/powershell/build.ps1

    - name: Test
      shell: pwsh
      run: Invoke-Pester ./packages/powershell/test -CI

    - name: Check public API
      shell: pwsh
      run: ./packages/powershell/scripts/public-api.ps1 -Check